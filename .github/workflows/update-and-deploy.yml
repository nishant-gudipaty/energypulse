name: Update data & deploy site

on:
  schedule:
    # GitHub's scheduler is best-effort: runs at busy times (:00 / :30) are often delayed or skipped.
    # So each update has an odd-minute main slot plus a backup ~1 hour later. Extra runs are harmless.
    # Times are UTC. IST = UTC + 5:30.
    - cron: "23 2 * * *"     # 07:53 IST  morning update
    - cron: "41 3 * * *"     # 09:11 IST  morning backup
    - cron: "23 10 * * *"    # 15:53 IST  afternoon update
    - cron: "41 11 * * *"    # 17:11 IST  afternoon backup
  push:
    branches: [main]
  workflow_dispatch: {}       # adds a "Run workflow" button in the Actions tab

concurrency:
  group: energypulse
  cancel-in-progress: false

jobs:
  # Job 1: fetch data, save it to the repo, package the site
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # lets the robot commit the new data files
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch today's data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}   # optional; enables Brent & WTI
        run: python scripts/update_data.py

      - name: Save data back to the repo
        run: |
          git config user.name "energypulse-bot"
          git config user.email "energypulse-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(TZ=Asia/Kolkata date +'%d %b %Y %H:%M IST')"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Package site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  # Job 2: publish the packaged site to GitHub Pages
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
